<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MZAZI APP</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b141a">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="unlock-page">
  <form class="unlock" id="unlock-form">
    <div class="unlock-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Zm4.5-5.9c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.6.1a6.5 6.5 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5a2 2 0 0 0 .3-.4v-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4 5.2 5.2 0 0 0 3.2.6 2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.2-.2-.4-.3Z"/></svg>
    </div>
    <h1>MZAZI APP</h1>
    <p class="muted">This installation is protected. Enter the password you set in <code>.env</code>.</p>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Open</button>
    <p class="err" id="err"></p>
  </form>
  <script>
    document.getElementById('unlock-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/api/unlock', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: document.getElementById('password').value }) });
      if (r.ok) location.href = '/';
      else document.getElementById('err').textContent = 'Wrong password.';
    });
  </script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});</script>
</body>
</html>
