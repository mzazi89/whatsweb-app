# Render blueprint: one always-on web service with a disk for the session.
services:
  - type: web
    name: whatsweb
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: ACCESS_PASSWORD
        sync: false
      - key: ALLOWED_NUMBER
        sync: false
    disk:
      name: whatsweb-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
